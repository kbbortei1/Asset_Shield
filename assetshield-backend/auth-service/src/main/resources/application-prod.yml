# Production hardening (SPRING_PROFILES_ACTIVE=prod).
# - dev-code is forced empty: the fixed OTP bypass can never be active in prod.
# - sms.provider has NO default: startup fails fast unless a provider is set
#   explicitly (prevents silently shipping the mock).
app:
  otp:
    dev-code: ""
  sms:
    provider: ${SMS_PROVIDER}
