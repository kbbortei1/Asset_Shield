# Production hardening (SPRING_PROFILES_ACTIVE=prod).
# - dev-code is forced empty: the fixed OTP bypass can never be active in prod.
# - channel has NO default here: startup fails fast unless a real delivery
#   channel (email) is set explicitly, so the dev log channel can't ship silently.
app:
  otp:
    dev-code: ""
    channel: ${OTP_CHANNEL}
