server:
  port: 8081

spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate never creates it
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# No defaults for secrets on purpose: startup fails fast when they are absent.
app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: 3600
  refresh:
    ttl-days: 14
  otp:
    ttl-seconds: 300
    max-attempts: 3
    resend-interval-seconds: 60
    dev-code: ${OTP_DEV_CODE:}
  sms:
    provider: ${SMS_PROVIDER:mock}
  internal-api-key: ${INTERNAL_API_KEY}
  marketplace-service-uri: ${MARKETPLACE_SERVICE_URL:http://marketplace-service:8084}
  superadmin:
    phone: ${SUPERADMIN_PHONE:}
    password: ${SUPERADMIN_PASSWORD:}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:/data/storage}
    s3-endpoint: ${SUPABASE_S3_ENDPOINT:}
    s3-region: ${SUPABASE_S3_REGION:}
    s3-access-key-id: ${SUPABASE_S3_ACCESS_KEY_ID:}
    s3-secret-access-key: ${SUPABASE_S3_SECRET_ACCESS_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:assetshield}
    signed-url-ttl-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: auth_svc
    password: ${AUTH_DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/auth_db
    username: auth_svc
    password: ${AUTH_DB_PASSWORD}
