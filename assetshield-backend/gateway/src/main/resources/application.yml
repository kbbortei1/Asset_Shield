server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # A slow downstream must not hold gateway connections indefinitely:
          # fail fast at the edge and let the client retry.
          httpclient:
            connect-timeout: 3000 # ms
            response-timeout: 20s
          routes:
            # More specific than the auth /users/** route — must stay first.
            - id: property-service-invitations
              uri: ${PROPERTY_SERVICE_URI:http://property-service:8082}
              predicates:
                - Path=/api/v1/users/me/invitations,/api/v1/users/me/asset-analytics

            # More specific than the auth /users/** route — must stay first.
            - id: damage-service-my-reports
              uri: ${DAMAGE_SERVICE_URI:http://damage-service:8083}
              predicates:
                - Path=/api/v1/users/me/damage-reports,/api/v1/users/me/dossiers

            # More specific than the auth /users/** route — must stay first.
            - id: marketplace-service-users-me
              uri: ${MARKETPLACE_SERVICE_URI:http://marketplace-service:8084}
              predicates:
                - Path=/api/v1/users/me/agent-interests,/api/v1/users/me/quotes,/api/v1/users/me/subscription

            # More specific than the auth /users/** route — must stay first.
            - id: payment-service-users-me
              uri: ${PAYMENT_SERVICE_URI:http://payment-service:8086}
              predicates:
                - Path=/api/v1/users/me/payments

            # More specific than the auth /users/** route — must stay first.
            - id: notification-service-users-me
              uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8085}
              predicates:
                - Path=/api/v1/users/me/device-token,/api/v1/users/me/notification-preferences,/api/v1/users/me/notifications

            # More specific than any general /admin/** → auth route — must stay first.
            - id: marketplace-service-admin-agents
              uri: ${MARKETPLACE_SERVICE_URI:http://marketplace-service:8084}
              predicates:
                - Path=/api/v1/admin/agents/**

            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/admins,/api/v1/admin/audit-events,/api/v1/admin/problem-reports/**,/api/v1/admin/broadcast,/api/v1/admin/audience-counts,/api/v1/admin/users,/api/v1/problem-reports/**,/api/v1/public/user-files/**

            # More specific than the property /properties/** route — must stay first.
            - id: damage-service-property-reports
              uri: ${DAMAGE_SERVICE_URI:http://damage-service:8083}
              predicates:
                - Path=/api/v1/properties/*/damage-reports/**

            - id: damage-service
              uri: ${DAMAGE_SERVICE_URI:http://damage-service:8083}
              predicates:
                - Path=/api/v1/damage-reports/**,/api/v1/public/damage-files/**

            # Tips slice of /properties/{id} — must stay before the property
            # /properties/** route (and never shadows /properties/*/damage-reports).
            - id: notification-service-property-tips
              uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8085}
              predicates:
                - Path=/api/v1/properties/*/tips

            - id: property-service
              uri: ${PROPERTY_SERVICE_URI:http://property-service:8082}
              predicates:
                - Path=/api/v1/properties/**,/api/v1/assets/**,/api/v1/invitations/**,/api/v1/public/files/**

            # Marketplace's slice of /dossiers/{id}: consent shares, agent
            # verify and quote — must stay before the damage /dossiers/** route.
            - id: marketplace-service-dossier-actions
              uri: ${MARKETPLACE_SERVICE_URI:http://marketplace-service:8084}
              predicates:
                - Path=/api/v1/dossiers/*/share-to-agent/**,/api/v1/dossiers/*/verify,/api/v1/dossiers/*/quote,/api/v1/dossiers/*/agent-download

            - id: damage-service-dossiers
              uri: ${DAMAGE_SERVICE_URI:http://damage-service:8083}
              predicates:
                - Path=/api/v1/dossiers/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://payment-service:8086}
              predicates:
                - Path=/api/v1/payments/**

            - id: marketplace-service-agents
              uri: ${MARKETPLACE_SERVICE_URI:http://marketplace-service:8084}
              predicates:
                - Path=/api/v1/agents/**,/api/v1/leads/**,/api/v1/agent-interests/**,/api/v1/quotes/**,/api/v1/subscriptions/**

            - id: notification-service-tips
              uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8085}
              predicates:
                - Path=/api/v1/tips/**

            # ── Aggregated API docs (dev only; gated by SWAGGER_ENABLED) ──────
            # Each route proxies a service's /v3/api-docs so the gateway's
            # swagger-ui can offer all five as a dropdown on one origin.
            - id: api-docs-auth
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/api-docs/auth
              filters:
                - SetPath=/v3/api-docs
            - id: api-docs-property
              uri: ${PROPERTY_SERVICE_URI:http://property-service:8082}
              predicates:
                - Path=/api-docs/property
              filters:
                - SetPath=/v3/api-docs
            - id: api-docs-damage
              uri: ${DAMAGE_SERVICE_URI:http://damage-service:8083}
              predicates:
                - Path=/api-docs/damage
              filters:
                - SetPath=/v3/api-docs
            - id: api-docs-marketplace
              uri: ${MARKETPLACE_SERVICE_URI:http://marketplace-service:8084}
              predicates:
                - Path=/api-docs/marketplace
              filters:
                - SetPath=/v3/api-docs
            - id: api-docs-notification
              uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8085}
              predicates:
                - Path=/api-docs/notification
              filters:
                - SetPath=/v3/api-docs
            - id: api-docs-payment
              uri: ${PAYMENT_SERVICE_URI:http://payment-service:8086}
              predicates:
                - Path=/api-docs/payment
              filters:
                - SetPath=/v3/api-docs

# No default on purpose: the gateway must fail fast when JWT_SECRET is absent.
app:
  jwt:
    secret: ${JWT_SECRET}
  rate-limit:
    capacity: 30
    refill-per-minute: 30
  # Aggregated Swagger UI toggle. Secure by default: OFF unless explicitly
  # enabled (the dev docker-compose opts in with SWAGGER_ENABLED=true). The
  # SwaggerGateFilter 404s all doc paths when false.
  swagger-enabled: ${SWAGGER_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    # The five downstream services, proxied via the api-docs-* routes above.
    urls:
      - name: auth-service
        url: /api-docs/auth
      - name: property-service
        url: /api-docs/property
      - name: damage-service
        url: /api-docs/damage
      - name: marketplace-service
        url: /api-docs/marketplace
      - name: notification-service
        url: /api-docs/notification
      - name: payment-service
        url: /api-docs/payment

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %5p [gateway] %-40.40logger{39} : %m%n"
