server:
  port: 8086

spring:
  application:
    name: payment-service
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate never creates it
    open-in-view: false
  flyway:
    enabled: true

# No defaults for secrets on purpose: startup fails fast when they are absent.
app:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-key: ${INTERNAL_API_KEY}
  damage-service-uri: ${DAMAGE_SERVICE_URL:http://damage-service:8083}
  marketplace-service-uri: ${MARKETPLACE_SERVICE_URL:http://marketplace-service:8084}
  payments:
    mode: ${PAYMENTS_MODE:mock}
    paystack-secret-key: ${PAYSTACK_SECRET_KEY:}
    paystack-base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
    # After payment, Paystack redirects the browser here; the app's deep link
    # makes the in-app browser auto-close and return to AssetShield.
    callback-url: ${PAYSTACK_CALLBACK_URL:assetshield://payment-callback}
    # mock mode: auto-settle delay simulating instant MoMo confirmation; <0 disables
    mock-auto-settle-ms: ${MOCK_AUTO_SETTLE_MS:2000}
    reconcile-enabled: ${PAYMENTS_RECONCILE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/payment_db
    username: payment_svc
    password: ${PAYMENT_DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/payment_db
    username: payment_svc
    password: ${PAYMENT_DB_PASSWORD}
