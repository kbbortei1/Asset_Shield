server:
  port: 8085

spring:
  application:
    name: notification-service
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate never creates it
    open-in-view: false
  flyway:
    enabled: true

# No defaults for secrets on purpose: startup fails fast when they are absent.
app:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-key: ${INTERNAL_API_KEY}
  property-service-uri: ${PROPERTY_SERVICE_URL:http://property-service:8082}
  fcm:
    mode: ${FCM_MODE:log}
    firebase-service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  tips:
    batch-size: ${TIPS_BATCH_SIZE:3}
    debounce-minutes: ${TIPS_DEBOUNCE_MINUTES:60}
  sched:
    # zone-aware (Africa/Accra) crons; overridable for tests and demos
    tip-delivery-cron: ${SCHED_TIP_DELIVERY_CRON:0 0 7 * * *}
    redoc-cron: ${SCHED_REDOC_CRON:0 0 9 * * *}
    redoc-stale-days: ${REDOC_STALE_DAYS:90}
    maintenance-cron: ${SCHED_MAINTENANCE_CRON:0 15 8 * * *}
    maintenance-lookahead-days: ${MAINTENANCE_LOOKAHEAD_DAYS:14}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/notification_db
    username: notification_svc
    password: ${NOTIFICATION_DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/notification_db
    username: notification_svc
    password: ${NOTIFICATION_DB_PASSWORD}
