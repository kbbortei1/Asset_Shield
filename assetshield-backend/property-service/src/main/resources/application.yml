server:
  port: 8082

spring:
  application:
    name: property-service
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate never creates it
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# No defaults for secrets on purpose: startup fails fast when they are absent.
app:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-key: ${INTERNAL_API_KEY}
  auth-service-uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:/data/storage}
    s3-endpoint: ${SUPABASE_S3_ENDPOINT:}
    s3-region: ${SUPABASE_S3_REGION:}
    s3-access-key-id: ${SUPABASE_S3_ACCESS_KEY_ID:}
    s3-secret-access-key: ${SUPABASE_S3_SECRET_ACCESS_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:assetshield}
    signed-url-ttl-minutes: 15
  tier:
    mode: ${TIER_LOOKUP_MODE:stub}
    stub-tier: ${STUB_TIER:PRO}
    marketplace-uri: ${MARKETPLACE_SERVICE_URL:http://marketplace-service:8084}
  marketplace:
    events-mode: ${MARKETPLACE_EVENTS_MODE:log}
    uri: ${MARKETPLACE_SERVICE_URL:http://marketplace-service:8084}
  notifications:
    mode: ${NOTIFICATIONS_MODE:log}
  events:
    mode: ${EVENTS_MODE:log}
  notification-service-uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
  limits:
    free-max-properties: 1
    free-max-assets-per-property: 30

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/property_db
    username: property_svc
    password: ${PROPERTY_DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/property_db
    username: property_svc
    password: ${PROPERTY_DB_PASSWORD}
