name: backend-ci

on:
  push:
    branches: [main]
    paths: ['assetshield-backend/**', '.github/workflows/ci-backend.yml']
  pull_request:
    paths: ['assetshield-backend/**', '.github/workflows/ci-backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - property-service
          - damage-service
          - marketplace-service
          - notification-service
          - payment-service
    name: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests (*IT) use Testcontainers; Docker is available on
      # ubuntu-latest runners out of the box.
      - name: Build & test
        working-directory: assetshield-backend/${{ matrix.service }}
        run: mvn -B verify
